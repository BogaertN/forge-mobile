name: Publish GKS
# Signs a General Knowledge Snapshot with the publisher key (Actions secret).
# Does not use a Supabase service role: the bootstrap body is repo-local (data/gks-body.json or empty overlay).
on:
  workflow_dispatch:
  push:
    paths:
      - 'source/data/gks-body.json'
      - 'source/tools/gks_publish.js'
      - 'source/src/gks.js'
    branches: [main]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Sign snapshot
        env:
          GKS_PUBLISHER_PRIVATE_JWK: ${{ secrets.GKS_PUBLISHER_PRIVATE_JWK }}
          FORGE_GKS_OUT: gks-out
        run: |
          if [ -z "$GKS_PUBLISHER_PRIVATE_JWK" ]; then echo "Secret GKS_PUBLISHER_PRIVATE_JWK is not set — Nic must add it (see forge-full-core-gaps.md)."; exit 1; fi
          node source/tools/gks_publish.js
      - name: Upload snapshot artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gks-snapshot
          path: gks-out/
      - name: Commit latest pointer into docs/gks (public, signed body only)
        run: |
          mkdir -p docs/gks
          cp gks-out/latest.json docs/gks/latest.json
          cp gks-out/*.json docs/gks/ || true
          git config user.name "gks-publisher"
          git config user.email "gks-publisher@users.noreply.github.com"
          git add docs/gks
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "gks: publish signed snapshot"
          git push
