name: Deploy Pages
# v4.8.3: Pages publishes ONLY the artifact this run verified and built. The release pipeline (sh source/tools/release.sh) runs the full
# suite first; build.py refuses to build unless verification passed on this exact tree; verify_release.js checks deployed-file hashes,
# one version / test total / commit everywhere and a clean git tree. The uploaded directory is _release/site.
# v4.8.4: every action is pinned to an immutable commit SHA (tag in the comment); Python dependencies are hash-locked (--require-hashes).
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (v4.4.0)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (v4.4.0)
        with:
          node-version: '20'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 (v5.6.0)
        with:
          python-version: '3.12'
      - name: Install the hash-locked Python dependency set
        run: python -m pip install --require-hashes --no-deps -r source/requirements-ci.txt
      - name: Verify, build and check the release (verification first)
        run: sh source/tools/release.sh
      - name: Release check summary
        run: tail -n 3 _release/verify/REPORT.md >/dev/null; node -e "const r=require('./_release/release_check.json');console.log(r.ok,r.version,r.commit,r.tests,r.manifest_sha256)"
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5 (v5.0.0)
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3 (v3.0.1)
        with:
          path: _release/site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4 (v4.0.5)
