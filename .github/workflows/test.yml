name: Test
# 4.9.194: run the breaker suite three times, then the targeted suite. This does not publish Pages.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (v4.4.0)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (v4.4.0)
        with:
          node-version: '20'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 (v5.6.0)
        with:
          python-version: '3.12'
      - name: Prepare the clone
        run: sh source/tools/prepare_clone.sh
      - name: Breaker and analyzer suite, three passes
        run: |
          node source/verify/r4194_suite.js
          node source/verify/r4194_suite.js
          node source/verify/r4194_suite.js
      - name: Drift v4.3 suite
        run: node source/verify/r4193_suite.js
      - name: Targeted suites
        run: node source/verify/targeted.js
